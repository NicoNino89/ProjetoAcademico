{% extends 'base/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">

    <h2>
        Alunos
    </h2>

    <div>

        <a
            href="{% url 'home' %}"
            class="btn btn-secondary"
        >
            Home
        </a>

        <a
            href="{% url 'criar_aluno' %}"
            class="btn btn-success"
        >
            Novo Aluno
        </a>

    </div>

</div>

<table class="table table-striped table-bordered">

    <thead>

        <tr>

            <th>
                Pessoa
            </th>

            <th>
                Matrícula
            </th>

            <th>
                Curso
            </th>

            <th width="180">
                Ações
            </th>

        </tr>

    </thead>

    <tbody>

        {% for aluno in alunos %}

        <tr>

            <td>
                {{ aluno.pessoa.nome }}
            </td>

            <td>
                {{ aluno.matricula }}
            </td>

            <td>
                {{ aluno.curso.nome }}
            </td>

            <td>

                <a
                    href="{% url 'editar_aluno' aluno.id %}"
                    class="btn btn-warning btn-sm"
                >
                    Editar
                </a>

                <a
                    href="{% url 'excluir_aluno' aluno.id %}"
                    class="btn btn-danger btn-sm"
                >
                    Excluir
                </a>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="4" class="text-center">

                Nenhum aluno cadastrado.

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}

{% extends 'base/base.html' %}

{% block content %}

<h2 class="mb-4">

    {% if form.instance.id %}

        Editar Disciplina

    {% else %}

        Nova Disciplina

    {% endif %}

</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="btn btn-success"
    >
        Salvar
    </button>

    <a
        href="{% url 'lista_disciplinas' %}"
        class="btn btn-secondary"
    >
        Cancelar
    </a>

</form>

{% endblock %}

{% extends 'base/base.html' %}

{% block content %}

<h2 class="mb-4">
    Excluir Curso
</h2>

<div class="alert alert-warning">

    Tem certeza que deseja excluir o curso:

    <strong>
        {{ curso.nome }}
    </strong>

    ?

</div>

<form method="POST">

    {% csrf_token %}

    <button
        type="submit"
        class="btn btn-danger"
    >
        Confirmar Exclusão
    </button>

    <a
        href="{% url 'lista_cursos' %}"
        class="btn btn-secondary"
    >
        Cancelar
    </a>

</form>

{% endblock %}
